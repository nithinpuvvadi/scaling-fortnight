name: Build and Update GitOps Manifest

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nexus-app:${{ github.sha }}

      - name: Update Deployment Manifest Image Tag
        run: |
          sed -i 's|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/nexus-app:${{ github.sha }}|g' kubernetes/deployment.yaml

      - name: Commit and Push Changes to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }}"
          git push origin main
