apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/nithinpuvvadi/scaling-fortnight.git'
    targetRevision: HEAD
    path: kubernetes/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true