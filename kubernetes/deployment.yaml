apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-app
  namespace: nexus-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-app
  template:
    metadata:
      labels:
        app: nexus-app
    spec:
      containers:
      - name: app
        image: nginx:alpine
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"