apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-app
  template:
    metadata:
      labels:
        app: nexus-app
    spec:
      containers:
      - name: nexus-app
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-app-svc
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: nexus-app
  ports:
  - port: 80
    targetPort: 80
